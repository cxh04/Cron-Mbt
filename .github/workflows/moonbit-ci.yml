name: MoonBit CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  verify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit toolchain on Unix
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          export MOONBIT_INSTALL_VERSION=0.10.3
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit toolchain on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = "0.10.3"
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Prepare registry
        run: |
          moon version --all
          moon update

      - name: moon check --target all --deny-warn
        run: moon check --target all --deny-warn

      - name: moon build --target all
        run: moon build --target all

      - name: moon fmt
        run: |
          moon fmt
          git diff --exit-code -- '*.mbt' '*.mbti'

      - name: moon info
        run: |
          moon info
          git diff --exit-code -- '*.mbt' '*.mbti'

      - name: moon test --target all --deny-warn
        run: moon test --target all --deny-warn
