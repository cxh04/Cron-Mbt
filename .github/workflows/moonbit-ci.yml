name: MoonBit CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Prepare registry
        run: |
          moon version --all
          moon update

      - name: moon check --deny-warn
        run: moon check --deny-warn

      - name: moon build
        run: moon build

      - name: moon fmt
        run: moon fmt

      - name: moon info
        run: moon info

      - name: moon test --deny-warn
        run: moon test --deny-warn
